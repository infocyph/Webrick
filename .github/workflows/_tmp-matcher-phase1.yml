name: Temporary Matcher Phase 1

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Finish compact executor cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          fast = Path('src/Router/Matching/CompiledMatcherFastEngine.php')
          text = fast.read_text()
          marker = """        return self::missOutcome($method, $allowed);\n    }\n\n    /**\n     * @param MatcherGroup|null $hostGroup\n"""
          insert = """        return self::missOutcome($method, $allowed);\n    }\n\n    /**\n     * Compact dispatch for up to two host-specific and two wildcard groups.\n     *\n     * ShardedMatcher uses this path to avoid allocating temporary candidate\n     * arrays for every cached request while preserving the same precedence as\n     * match(): host primary, host secondary, wildcard primary, wildcard secondary.\n     *\n     * @param MatcherGroup|null $hostPrimary\n     * @param MatcherGroup|null $hostSecondary\n     * @param MatcherGroup|null $wildcardPrimary\n     * @param MatcherGroup|null $wildcardSecondary\n     * @return CompiledMatch\n     */\n    public function matchCandidates(\n        ?array $hostPrimary,\n        ?array $hostSecondary,\n        ?array $wildcardPrimary,\n        ?array $wildcardSecondary,\n        string $method,\n        string $path,\n    ): int|array|MatchOutcome {\n        $hit = self::matchStaticPair($hostPrimary, $hostSecondary, $method, $path);\n        if ($hit !== null) {\n            return $hit;\n        }\n        $hit = self::matchStaticPair($wildcardPrimary, $wildcardSecondary, $method, $path);\n        if ($hit !== null) {\n            return $hit;\n        }\n\n        [$count, $prefix] = self::pathShape($path);\n        $hit = $this->matchDynamicPair($hostPrimary, $hostSecondary, $method, $path, $count, $prefix);\n        if ($hit !== null) {\n            return $hit;\n        }\n        $hit = $this->matchDynamicPair($wildcardPrimary, $wildcardSecondary, $method, $path, $count, $prefix);\n        if ($hit !== null) {\n            return $hit;\n        }\n\n        $allowed = [];\n        $skip = self::alreadyTestedMethods($method);\n        self::collectStaticAllowedPair($hostPrimary, $hostSecondary, $path, $skip, $allowed);\n        self::collectStaticAllowedPair($wildcardPrimary, $wildcardSecondary, $path, $skip, $allowed);\n        $segments = null;\n        $this->collectDynamicAllowedPair(\n            $hostPrimary,\n            $hostSecondary,\n            $path,\n            $count,\n            $prefix,\n            $skip,\n            $allowed,\n            $segments,\n        );\n        $this->collectDynamicAllowedPair(\n            $wildcardPrimary,\n            $wildcardSecondary,\n            $path,\n            $count,\n            $prefix,\n            $skip,\n            $allowed,\n            $segments,\n        );\n\n        return self::missOutcome($method, $allowed);\n    }\n\n    /**\n     * @param MatcherGroup|null $hostGroup\n"""
          if marker not in text:
              raise SystemExit('FastEngine insertion marker not found')
          text = text.replace(marker, insert, 1)

          private_marker = """    /**\n     * @param MatcherGroup|null $hostGroup\n     * @param MatcherGroup|null $wildcardGroup\n     * @return int|array{0:int,1:array<string,string>}|null\n     */\n    private function matchSingleDynamic(\n"""
          helpers = """    /**\n     * @param MatcherGroup|null $primary\n     * @param MatcherGroup|null $secondary\n     * @param array<string,true> $skip\n     * @param array<string,bool> $allowed\n     */\n    private static function collectStaticAllowedPair(\n        ?array $primary,\n        ?array $secondary,\n        string $path,\n        array $skip,\n        array &$allowed,\n    ): void {\n        if ($primary !== null) {\n            self::collectCompiledStaticAllowedGroup($primary, $path, $skip, $allowed);\n        }\n        if ($secondary !== null) {\n            self::collectCompiledStaticAllowedGroup($secondary, $path, $skip, $allowed);\n        }\n    }\n\n    /**\n     * @param MatcherGroup|null $primary\n     * @param MatcherGroup|null $secondary\n     * @param array<string,true> $skip\n     * @param array<string,bool> $allowed\n     * @param list<string>|null $segments\n     */\n    private function collectDynamicAllowedPair(\n        ?array $primary,\n        ?array $secondary,\n        string $path,\n        int $count,\n        string $prefix,\n        array $skip,\n        array &$allowed,\n        ?array &$segments,\n    ): void {\n        if ($primary !== null) {\n            $this->dynamic->collectAllowedGroup($primary, $path, $count, $prefix, $skip, $allowed, $segments);\n        }\n        if ($secondary !== null) {\n            $this->dynamic->collectAllowedGroup($secondary, $path, $count, $prefix, $skip, $allowed, $segments);\n        }\n    }\n\n    /**\n     * @param MatcherGroup|null $primary\n     * @param MatcherGroup|null $secondary\n     * @return int|array{0:int,1:array<string,string>}|null\n     */\n    private function matchDynamicPair(\n        ?array $primary,\n        ?array $secondary,\n        string $method,\n        string $path,\n        int $count,\n        string $prefix,\n    ): int|array|null {\n        if ($primary !== null) {\n            $hit = $this->dynamic->matchRequested($primary, $method, $path, $count, $prefix);\n            if ($hit !== null) {\n                return $hit;\n            }\n        }\n        if ($secondary !== null) {\n            return $this->dynamic->matchRequested($secondary, $method, $path, $count, $prefix);\n        }\n\n        return null;\n    }\n\n    /**\n     * @param MatcherGroup|null $primary\n     * @param MatcherGroup|null $secondary\n     */\n    private static function matchStaticPair(\n        ?array $primary,\n        ?array $secondary,\n        string $method,\n        string $path,\n    ): ?int {\n        if ($primary !== null) {\n            $hit = self::matchStaticRequested($primary, $method, $path);\n            if ($hit !== null) {\n                return $hit;\n            }\n        }\n\n        return $secondary === null ? null : self::matchStaticRequested($secondary, $method, $path);\n    }\n\n""" + private_marker
          if private_marker not in text:
              raise SystemExit('FastEngine private marker not found')
          text = text.replace(private_marker, helpers, 1)
          fast.write_text(text)

          sharded = Path('src/Router/Matching/ShardedMatcher.php')
          text = sharded.read_text()
          old = """        $bucket = CanonicalMatcherIndex::prefixForPath($path);\n        $bucket = $bucket === '' ? self::SHARD_ROOT : $bucket;\n        $hostGroups = $this->loadCandidateGroups($host, $bucket);\n        $wildcardGroups = $host !== '*' ? $this->loadCandidateGroups('*', $bucket) : [];\n\n        return $compact\n            ? $this->fastEngine->match($hostGroups, $wildcardGroups, $method, $path)\n            : $this->engine->match($hostGroups, $wildcardGroups, $method, $path);\n"""
          new = """        $bucket = CanonicalMatcherIndex::prefixForPath($path);\n        $bucket = $bucket === '' ? self::SHARD_ROOT : $bucket;\n        if ($compact) {\n            $hostPrimary = $this->loadGroup($host, $bucket);\n            $hostSecondary = $bucket !== self::SHARD_DYNAMIC\n                ? $this->loadGroup($host, self::SHARD_DYNAMIC)\n                : null;\n            $wildcardPrimary = null;\n            $wildcardSecondary = null;\n            if ($host !== '*') {\n                $wildcardPrimary = $this->loadGroup('*', $bucket);\n                $wildcardSecondary = $bucket !== self::SHARD_DYNAMIC\n                    ? $this->loadGroup('*', self::SHARD_DYNAMIC)\n                    : null;\n            }\n\n            return $this->fastEngine->matchCandidates(\n                $hostPrimary,\n                $hostSecondary,\n                $wildcardPrimary,\n                $wildcardSecondary,\n                $method,\n                $path,\n            );\n        }\n\n        $hostGroups = $this->loadCandidateGroups($host, $bucket);\n        $wildcardGroups = $host !== '*' ? $this->loadCandidateGroups('*', $bucket) : [];\n\n        return $this->engine->match($hostGroups, $wildcardGroups, $method, $path);\n"""
          if old not in text:
              raise SystemExit('Sharded compact dispatch marker not found')
          sharded.write_text(text.replace(old, new, 1))

          outcome = Path('benchmarks/MatcherOutcomeBench.php')
          text = outcome.read_text()
          marker = """            'dynamic-hit' => [\n                'route_set' => 'route-cache',\n                'method' => 'GET',\n                'host' => 'localhost',\n                'path' => '/hello/benchmark',\n            ],\n"""
          replacement = marker + """            'static-404' => [\n                'route_set' => 'route-cache',\n                'method' => 'GET',\n                'host' => 'localhost',\n                'path' => '/missing',\n            ],\n            'dynamic-head-fallback' => [\n                'route_set' => 'route-cache',\n                'method' => 'HEAD',\n                'host' => 'localhost',\n                'path' => '/hello/benchmark',\n            ],\n"""
          if marker not in text:
              raise SystemExit('Outcome benchmark marker not found')
          outcome.write_text(text.replace(marker, replacement, 1))
          PY
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Syntax check changed matcher files
        run: |
          php -l src/Router/Matching/CompiledMatcherFastEngine.php
          php -l src/Router/Matching/CompiledMatcherDynamicEngine.php
          php -l src/Router/Matching/ShardedMatcher.php
          php -l benchmarks/MatcherOutcomeBench.php
          php -l benchmarks/MatcherPathInspectionBench.php
      - name: Run project code tests through PHPForge
        run: composer ic:test:code
      - name: Run matcher outcome baseline
        run: vendor/bin/phpbench run benchmarks/MatcherOutcomeBench.php --bootstrap=vendor/autoload.php --report=aggregate
      - name: Run path inspection baseline
        run: vendor/bin/phpbench run benchmarks/MatcherPathInspectionBench.php --bootstrap=vendor/autoload.php --report=aggregate
      - name: Commit completed phase 1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Router/Matching/CompiledMatcherFastEngine.php src/Router/Matching/ShardedMatcher.php benchmarks/MatcherOutcomeBench.php
          git diff --cached --quiet && exit 0
          git commit -m "perf: complete matcher phase 1 hot-path cleanup"
          git push origin HEAD:webrick-5/batch-1-correctness
