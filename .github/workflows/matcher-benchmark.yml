name: Matcher Reference Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - webrick-5/batch-1-correctness
    paths:
      - '.github/workflows/matcher-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Environment
        run: |
          php -v
          php -i | grep -E '^(opcache.enable|opcache.jit|pcre.jit)' || true

      - name: Matcher semantic sanity
        run: php benchmark/matcher_sanity.php

      - name: FastRoute reference - 100 routes
        run: php benchmark/fastroute_reference.php --routes=100 --iters=20000 --rounds=3 --warmup=2000 | tee benchmark-fastroute-100.txt

      - name: FastRoute reference - 1000 routes
        run: php benchmark/fastroute_reference.php --routes=1000 --iters=5000 --rounds=3 --warmup=1000 | tee benchmark-fastroute-1000.txt

      - name: FastRoute reference - 5000 routes
        run: php benchmark/fastroute_reference.php --routes=5000 --iters=1000 --rounds=3 --warmup=200 | tee benchmark-fastroute-5000.txt

      - name: FastRoute reference - 10000 routes
        run: php benchmark/fastroute_reference.php --routes=10000 --iters=500 --rounds=3 --warmup=100 | tee benchmark-fastroute-10000.txt

      - name: Webrick capability benchmark
        run: php benchmark/matcher_capabilities.php --routes=1000 --iters=3000 --rounds=3 --warmup=500 | tee benchmark-webrick-capabilities.txt

      - name: Webrick native matcher benchmark
        run: php benchmark/hello_matchers.php --iters=10000 --rounds=3 --warmup=1000 | tee benchmark-webrick-native.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matcher-benchmark-php-${{ matrix.php }}
          path: benchmark-*.txt
          if-no-files-found: warn
