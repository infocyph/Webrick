name: Temporary Matcher Phase 2

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: read

jobs:
  phase2-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Create Phase 2 experiment benchmark
        shell: bash
        run: |
          cat > benchmarks/MatcherPathPhase2ExperimentBench.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Infocyph\Webrick\Benchmarks;

          use PhpBench\Attributes as Bench;

          #[Bench\Groups(['matcher', 'matcher-path-phase2'])]
          #[Bench\Iterations(7)]
          #[Bench\Revs(10000)]
          #[Bench\Warmup(2)]
          final class MatcherPathPhase2ExperimentBench
          {
              #[Bench\ParamProviders('providePaths')]
              public function benchCurrentShape(array $params): void
              {
                  [$count, $prefix] = self::currentShape((string) $params['path']);
                  self::guardShape($count, $prefix);
              }

              #[Bench\ParamProviders('providePaths')]
              public function benchOffsetShape(array $params): void
              {
                  [$count, $prefix] = self::offsetShape((string) $params['path']);
                  self::guardShape($count, $prefix);
              }

              #[Bench\ParamProviders('providePaths')]
              public function benchOnePassShape(array $params): void
              {
                  [$count, $prefix] = self::onePassShape((string) $params['path']);
                  self::guardShape($count, $prefix);
              }

              #[Bench\ParamProviders('provideSelectedSegments')]
              public function benchCurrentSelectedSegment(array $params): void
              {
                  $value = self::currentSelectedSegment((string) $params['path'], (int) $params['segment']);
                  self::guardSegment($value);
              }

              #[Bench\ParamProviders('provideSelectedSegments')]
              public function benchOffsetSelectedSegment(array $params): void
              {
                  $value = self::offsetSelectedSegment((string) $params['path'], (int) $params['segment']);
                  self::guardSegment($value);
              }

              #[Bench\ParamProviders('providePaths')]
              public function benchCurrentShapeAndSegments(array $params): void
              {
                  $path = (string) $params['path'];
                  [$count, $prefix] = self::currentShape($path);
                  $segments = self::currentSegments($path);
                  self::guardCombined($count, $prefix, $segments);
              }

              #[Bench\ParamProviders('providePaths')]
              public function benchOnePassViewAndMaterialize(array $params): void
              {
                  [$count, $prefix, $segments] = self::onePassView((string) $params['path']);
                  self::guardCombined($count, $prefix, $segments);
              }

              /** @return iterable<string, array{path:string}> */
              public function providePaths(): iterable
              {
                  yield 'root' => ['path' => '/'];
                  yield 'single' => ['path' => '/users'];
                  yield 'shallow' => ['path' => '/users/42'];
                  yield 'medium' => ['path' => '/api/v1/users/42'];
                  yield 'deep' => ['path' => '/api/v1/accounts/42/orders/900/items/benchmark'];
                  yield 'extra-slashes' => ['path' => '//api/v1/users/42//'];
              }

              /** @return iterable<string, array{path:string,segment:int}> */
              public function provideSelectedSegments(): iterable
              {
                  yield 'shallow-last' => ['path' => '/users/42', 'segment' => 1];
                  yield 'medium-middle' => ['path' => '/api/v1/users/42', 'segment' => 2];
                  yield 'deep-middle' => ['path' => '/api/v1/accounts/42/orders/900/items/benchmark', 'segment' => 5];
                  yield 'deep-first' => ['path' => '/api/v1/accounts/42/orders/900/items/benchmark', 'segment' => 0];
                  yield 'extra-slashes' => ['path' => '//api/v1/users/42//', 'segment' => 2];
              }

              /** @return array{0:int,1:string} */
              private static function currentShape(string $path): array
              {
                  $trimmed = trim($path, '/');
                  if ($trimmed === '') {
                      return [0, ''];
                  }

                  $slash = strpos($trimmed, '/');
                  $prefix = $slash === false ? $trimmed : substr($trimmed, 0, $slash);

                  return [substr_count($trimmed, '/') + 1, $prefix];
              }

              /** @return list<string> */
              private static function currentSegments(string $path): array
              {
                  if ($path === '/' || $path === '') {
                      return [];
                  }

                  $trimmed = trim($path, '/');

                  return $trimmed === '' ? [] : explode('/', $trimmed);
              }

              private static function currentSelectedSegment(string $path, int $segment): ?string
              {
                  return self::currentSegments($path)[$segment] ?? null;
              }

              /** @return array{0:int,1:string} */
              private static function offsetShape(string $path): array
              {
                  [$start, $end] = self::trimBounds($path);
                  if ($start === $end) {
                      return [0, ''];
                  }

                  $slash = strpos($path, '/', $start);
                  $prefixEnd = $slash === false || $slash >= $end ? $end : $slash;
                  $prefix = substr($path, $start, $prefixEnd - $start);
                  $count = substr_count($path, '/', $start, $end - $start) + 1;

                  return [$count, $prefix];
              }

              private static function offsetSelectedSegment(string $path, int $segment): ?string
              {
                  [$start, $end] = self::trimBounds($path);
                  if ($start === $end) {
                      return null;
                  }

                  $cursor = $start;
                  for ($index = 0; $index < $segment; ++$index) {
                      $slash = strpos($path, '/', $cursor);
                      if ($slash === false || $slash >= $end) {
                          return null;
                      }
                      $cursor = $slash + 1;
                  }

                  $slash = strpos($path, '/', $cursor);
                  $stop = $slash === false || $slash >= $end ? $end : $slash;

                  return substr($path, $cursor, $stop - $cursor);
              }

              /** @return array{0:int,1:string} */
              private static function onePassShape(string $path): array
              {
                  [$start, $end] = self::trimBounds($path);
                  if ($start === $end) {
                      return [0, ''];
                  }

                  $count = 1;
                  $prefixEnd = $end;
                  for ($index = $start; $index < $end; ++$index) {
                      if ($path[$index] !== '/') {
                          continue;
                      }
                      if ($prefixEnd === $end) {
                          $prefixEnd = $index;
                      }
                      ++$count;
                  }

                  return [$count, substr($path, $start, $prefixEnd - $start)];
              }

              /** @return array{0:int,1:string,2:list<string>} */
              private static function onePassView(string $path): array
              {
                  [$start, $end] = self::trimBounds($path);
                  if ($start === $end) {
                      return [0, '', []];
                  }

                  $segments = [];
                  $segmentStart = $start;
                  for ($index = $start; $index < $end; ++$index) {
                      if ($path[$index] !== '/') {
                          continue;
                      }
                      $segments[] = substr($path, $segmentStart, $index - $segmentStart);
                      $segmentStart = $index + 1;
                  }
                  $segments[] = substr($path, $segmentStart, $end - $segmentStart);

                  return [count($segments), $segments[0], $segments];
              }

              /** @return array{0:int,1:int} */
              private static function trimBounds(string $path): array
              {
                  $start = 0;
                  $end = strlen($path);
                  while ($start < $end && $path[$start] === '/') {
                      ++$start;
                  }
                  while ($end > $start && $path[$end - 1] === '/') {
                      --$end;
                  }

                  return [$start, $end];
              }

              private static function guardCombined(int $count, string $prefix, array $segments): void
              {
                  if ($count < 0 || $prefix === "\0" || count($segments) < 0) {
                      throw new \LogicException('Unreachable benchmark guard.');
                  }
              }

              private static function guardSegment(?string $value): void
              {
                  if ($value === "\0") {
                      throw new \LogicException('Unreachable benchmark guard.');
                  }
              }

              private static function guardShape(int $count, string $prefix): void
              {
                  if ($count < 0 || $prefix === "\0") {
                      throw new \LogicException('Unreachable benchmark guard.');
                  }
              }
          }
          PHP
      - name: Run Phase 2 experiment
        run: vendor/bin/phpbench run benchmarks/MatcherPathPhase2ExperimentBench.php --bootstrap=vendor/autoload.php --report=aggregate
