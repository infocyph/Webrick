name: Temporary Matcher Phase 2

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  phase2-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Record Phase 2 decision
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          plan = Path('MATCHER_OPTIMIZATION_PLAN.md')
          text = plan.read_text()
          text = text.replace(
              'Status: active development plan — Phase 1 complete  ',
              'Status: active development plan — Phases 1–2 complete  ',
              1,
          )
          phase = """## Phase 2 — Path scanner / request path view\n\nGoal: inspect a dynamic request path once and reuse the result.\n\nPrototype a compact scanner representation that can provide:\n\n- segment count;\n- first segment;\n- selected segment values;\n- segment start/end offsets;\n- lazy parameter materialization.\n\nBenchmark at least two implementations:\n\n1. current string helpers (`trim`, `strpos`, `substr_count`, optional `explode`);\n2. one-pass offset scanner.\n\nReject the scanner if PHP-level scanning is slower than the current C-backed string primitives on representative route sets.\n"""
          completion = phase + """\n**Status: complete (2026-09-01) — scanner rejected by benchmark.**\n\nDecision record:\n\n- The current C-backed string strategy remains the production design: `trim()`, `strpos()`, `substr_count()`, and lazy `explode()` only when segment materialization is actually required.\n- A PHP one-pass scanner was benchmarked for segment count + first-prefix extraction and for a materialized request-path view. It was slower for every representative path shape.\n- A second candidate that avoided `explode()` by walking to one selected segment with repeated `strpos()` calls was also slower for every tested segment position, including the first segment.\n- No `PathView` object/array is introduced. Allocating a per-request path representation would add cost to PCRE-only dynamic hits that currently never need segment materialization.\n- `MatcherPathInspectionBench` now permanently retains the current-vs-one-pass comparison so this rejected direction remains reproducible.\n- This phase intentionally makes no production matcher change: the acceptance rule required a measured win, and none was present.\n\nPHP 8.4.25 experiment results (GitHub runner, opcache disabled):\n\n| Inspection case | Current | Candidate | Result |\n| --- | ---: | ---: | --- |\n| shape, shallow path | 0.285 µs | 0.529 µs one-pass | current ~46% lower latency |\n| shape, medium path | 0.288 µs | 0.672 µs one-pass | current ~57% lower latency |\n| shape, deep path | 0.296 µs | 1.264 µs one-pass | current ~77% lower latency |\n| shape + segments, shallow | 0.491 µs | 0.659 µs one-pass view | current ~25% lower latency |\n| shape + segments, medium | 0.518 µs | 0.855 µs one-pass view | current ~39% lower latency |\n| shape + segments, deep | 0.591 µs | 1.533 µs one-pass view | current ~61% lower latency |\n| selected segment, shallow | 0.250 µs explode/index | 0.416 µs offset walk | current ~40% lower latency |\n| selected segment, deep middle | 0.352 µs explode/index | 0.577 µs offset walk | current ~39% lower latency |\n\nPhase 3 therefore starts from the existing lazy path materialization model. Constraint specialization must improve matcher work without depending on a PHP-level request-path scanner.\n"""
          if '**Status: complete (2026-09-01) — scanner rejected by benchmark.**' not in text:
              if phase not in text:
                  raise SystemExit('Phase 2 plan marker not found')
              text = text.replace(phase, completion, 1)
          plan.write_text(text)
          PY
      - name: Apply PHPForge style
        run: |
          vendor/bin/pint \
            --config=vendor/infocyph/phpforge/resources/pint.json \
            benchmarks/MatcherPathInspectionBench.php
      - name: Syntax check retained benchmark
        run: php -l benchmarks/MatcherPathInspectionBench.php
      - name: Run complete PHPForge CI gate
        run: composer ic:ci
      - name: Run retained Phase 2 benchmark
        run: vendor/bin/phpbench run benchmarks/MatcherPathInspectionBench.php --bootstrap=vendor/autoload.php --report=aggregate
      - name: Commit completed Phase 2 and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_tmp-matcher-phase2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            MATCHER_OPTIMIZATION_PLAN.md \
            benchmarks/MatcherPathInspectionBench.php \
            .github/workflows/_tmp-matcher-phase2.yml
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "perf: complete matcher phase 2 path decision"
          git push origin HEAD:webrick-5/batch-1-correctness
