name: Temporary Matcher Phase 3

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  phase3-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Implement built-in constraint opcodes
        shell: bash
        run: |
          cat > src/Router/Matching/CompiledMatcherConstraintOpcode.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Infocyph\Webrick\Router\Matching;

          /** Matcher-only opcodes for built-in callable route constraints. */
          final class CompiledMatcherConstraintOpcode
          {
              public const int ALNUM = 4;

              public const int ALPHA = 3;

              public const int BOOL = 5;

              public const int DIGIT = 1;

              public const int IPV6 = 7;

              public const int JSON = 6;

              public const int NUMERIC = 2;

              private function __construct() {}

              public static function fromCallable(string $callable): ?int
              {
                  return match (strtolower(ltrim($callable, '\\'))) {
                      'ctype_digit' => self::DIGIT,
                      'is_numeric' => self::NUMERIC,
                      'ctype_alpha' => self::ALPHA,
                      'ctype_alnum' => self::ALNUM,
                      'infocyph\\webrick\\router\\constraint\\registry::isboolstring' => self::BOOL,
                      'json_validate' => self::JSON,
                      'infocyph\\webrick\\router\\constraint\\registry::isipv6string' => self::IPV6,
                      default => null,
                  };
              }

              public static function isValid(int $opcode): bool
              {
                  return $opcode >= self::DIGIT && $opcode <= self::IPV6;
              }

              public static function matches(int $opcode, string $value): bool
              {
                  return match ($opcode) {
                      self::DIGIT => ctype_digit($value),
                      self::NUMERIC => is_numeric($value),
                      self::ALPHA => ctype_alpha($value),
                      self::ALNUM => ctype_alnum($value),
                      self::BOOL => self::matchesBool($value),
                      self::JSON => json_validate($value),
                      self::IPV6 => filter_var($value, FILTER_VALIDATE_IP, FILTER_FLAG_IPV6) !== false,
                      default => false,
                  };
              }

              private static function matchesBool(string $value): bool
              {
                  $value = strtolower($value);

                  return $value === 'true' || $value === 'false' || $value === '0' || $value === '1';
              }
          }
          PHP

          python3 <<'PY'
          from pathlib import Path

          compiler = Path('src/Router/Matching/CompiledMatcherIndexCompiler.php')
          text = compiler.read_text()
          marker = """    /**\n     * @param list<array{segments:list<SegmentSpec>,route:RouteValue,id:int,pcre:bool}> $routes\n     * @return list<DynamicStep>\n     */\n    private function compileSteps(array $routes): array\n"""
          helper = """    /**\n     * @param list<SegmentSpec> $segments\n     * @return list<SegmentSpec>\n     */\n    private static function compileFallbackSegments(array $segments): array\n    {\n        $compiled = [];\n        foreach ($segments as $segment) {\n            $call = $segment['call'] ?? null;\n            if (($segment['type'] ?? null) !== 'var' || !is_string($call)) {\n                $compiled[] = $segment;\n\n                continue;\n            }\n\n            $name = $segment['name'] ?? null;\n            if (!is_string($name) || $name === '') {\n                throw new \\UnexpectedValueException('Compiled matcher callable segment is invalid.');\n            }\n\n            $opcode = CompiledMatcherConstraintOpcode::fromCallable($call);\n            $compiled[] = $opcode === null\n                ? $segment\n                : ['type' => 'op', 'name' => $name, 'code' => $opcode];\n        }\n\n        return $compiled;\n    }\n\n""" + marker
          if marker not in text:
              raise SystemExit('Compiler helper marker not found')
          text = text.replace(marker, helper, 1)
          old = """            $steps[] = [\n                'type' => 'fallback',\n                'segments' => $entry['segments'],\n                'route' => $entry['route'],\n                'id' => $entry['id'],\n            ];\n"""
          new = """            $steps[] = [\n                'type' => 'fallback',\n                'segments' => self::compileFallbackSegments($entry['segments']),\n                'route' => $entry['route'],\n                'id' => $entry['id'],\n            ];\n"""
          if old not in text:
              raise SystemExit('Compiler fallback marker not found')
          compiler.write_text(text.replace(old, new, 1))

          engine = Path('src/Router/Matching/CompiledMatcherDynamicEngine.php')
          text = engine.read_text()
          old = """    /**\n     * @param list<array<string,mixed>> $specs\n     * @param list<string> $segments\n     * @return array<string,string>|null\n     */\n    private static function matchFallbackSegments(array $specs, array $segments): ?array\n    {\n        $params = [];\n        foreach ($specs as $index => $spec) {\n            $piece = $segments[$index] ?? null;\n            if (!is_string($piece)) {\n                return null;\n            }\n            if (($spec['type'] ?? null) === 'lit') {\n                if (($spec['val'] ?? null) !== $piece) {\n                    return null;\n                }\n\n                continue;\n            }\n\n            $name = $spec['name'] ?? null;\n            if (($spec['type'] ?? null) !== 'var' || !is_string($name)) {\n                return null;\n            }\n            $matches = isset($spec['regex'])\n                ? is_string($spec['regex']) && preg_match($spec['regex'], $piece) === 1\n                : is_callable($spec['call'] ?? null) && ($spec['call'])($piece);\n            if (!$matches) {\n                return null;\n            }\n\n            $params[$name] = $piece;\n        }\n\n        return $params;\n    }\n"""
          new = """    /**\n     * @param list<array<string,mixed>> $specs\n     * @param list<string> $segments\n     * @return array<string,string>|null\n     */\n    private static function matchFallbackSegments(array $specs, array $segments): ?array\n    {\n        $params = [];\n        foreach ($specs as $index => $spec) {\n            $piece = $segments[$index] ?? null;\n            if (!is_string($piece)) {\n                return null;\n            }\n            if (($spec['type'] ?? null) === 'lit') {\n                if (($spec['val'] ?? null) !== $piece) {\n                    return null;\n                }\n\n                continue;\n            }\n\n            $name = $spec['name'] ?? null;\n            if (!is_string($name) || !self::matchesFallbackVariable($spec, $piece)) {\n                return null;\n            }\n            $params[$name] = $piece;\n        }\n\n        return $params;\n    }\n\n    /** @param array<string,mixed> $spec */\n    private static function matchesFallbackVariable(array $spec, string $piece): bool\n    {\n        if (($spec['type'] ?? null) === 'op') {\n            $code = $spec['code'] ?? null;\n\n            return is_int($code) && CompiledMatcherConstraintOpcode::matches($code, $piece);\n        }\n        if (($spec['type'] ?? null) !== 'var') {\n            return false;\n        }\n\n        $regex = $spec['regex'] ?? null;\n        if (is_string($regex)) {\n            return preg_match($regex, $piece) === 1;\n        }\n\n        $call = $spec['call'] ?? null;\n\n        return is_callable($call) && $call($piece);\n    }\n"""
          if old not in text:
              raise SystemExit('Dynamic fallback marker not found')
          engine.write_text(text.replace(old, new, 1))

          validator = Path('src/Router/Matching/CompactMatcherDynamicValidator.php')
          text = validator.read_text()
          old = """    /** @return list<array<string,mixed>> */\n    private static function validateSegments(mixed $raw): array\n    {\n        if (!is_array($raw) || !array_is_list($raw)) {\n            throw new \\UnexpectedValueException('Compact matcher fallback segments are invalid.');\n        }\n\n        $segments = [];\n        foreach ($raw as $segment) {\n            if (!is_array($segment) || !is_string($segment['type'] ?? null)) {\n                throw new \\UnexpectedValueException('Compact matcher fallback segment is invalid.');\n            }\n            /** @var array<string,mixed> $segment */\n            $segments[] = $segment;\n        }\n\n        return $segments;\n    }\n"""
          new = """    /** @return array{type:'lit',val:string} */\n    private static function validateLiteralSegment(array $segment): array\n    {\n        $value = $segment['val'] ?? null;\n        if (!is_string($value)) {\n            throw new \\UnexpectedValueException('Compact matcher fallback literal segment is invalid.');\n        }\n\n        return ['type' => 'lit', 'val' => $value];\n    }\n\n    /** @return array{type:'op',name:string,code:int} */\n    private static function validateOpcodeSegment(array $segment): array\n    {\n        $name = $segment['name'] ?? null;\n        $code = $segment['code'] ?? null;\n        if (!is_string($name) || $name === '' || !is_int($code) || !CompiledMatcherConstraintOpcode::isValid($code)) {\n            throw new \\UnexpectedValueException('Compact matcher fallback opcode segment is invalid.');\n        }\n\n        return ['type' => 'op', 'name' => $name, 'code' => $code];\n    }\n\n    /** @return array<string,mixed> */\n    private static function validateSegment(mixed $segment): array\n    {\n        if (!is_array($segment) || !is_string($segment['type'] ?? null)) {\n            throw new \\UnexpectedValueException('Compact matcher fallback segment is invalid.');\n        }\n\n        return match ($segment['type']) {\n            'lit' => self::validateLiteralSegment($segment),\n            'op' => self::validateOpcodeSegment($segment),\n            'var' => self::validateVariableSegment($segment),\n            default => throw new \\UnexpectedValueException('Compact matcher fallback segment type is invalid.'),\n        };\n    }\n\n    /** @return list<array<string,mixed>> */\n    private static function validateSegments(mixed $raw): array\n    {\n        if (!is_array($raw) || !array_is_list($raw)) {\n            throw new \\UnexpectedValueException('Compact matcher fallback segments are invalid.');\n        }\n\n        $segments = [];\n        foreach ($raw as $segment) {\n            $segments[] = self::validateSegment($segment);\n        }\n\n        return $segments;\n    }\n\n    /** @return array<string,mixed> */\n    private static function validateVariableSegment(array $segment): array\n    {\n        $name = $segment['name'] ?? null;\n        if (!is_string($name) || $name === '') {\n            throw new \\UnexpectedValueException('Compact matcher fallback variable segment is invalid.');\n        }\n\n        $regex = $segment['regex'] ?? null;\n        if (is_string($regex)) {\n            return ['type' => 'var', 'name' => $name, 'regex' => $regex];\n        }\n\n        $call = $segment['call'] ?? null;\n        if (!is_string($call) || !is_callable($call)) {\n            throw new \\UnexpectedValueException('Compact matcher fallback callable segment is invalid.');\n        }\n\n        return ['type' => 'var', 'name' => $name, 'call' => $call];\n    }\n"""
          if old not in text:
              raise SystemExit('Validator segment marker not found')
          validator.write_text(text.replace(old, new, 1))

          for path in ['src/Router/Matching/FusedMatcher.php', 'src/Router/Matching/ShardedMatcher.php']:
              file = Path(path)
              text = file.read_text()
              old = 'private const int INDEX_CACHE_VERSION = 14;'
              if old not in text:
                  raise SystemExit(f'Cache version marker missing: {path}')
              file.write_text(text.replace(old, 'private const int INDEX_CACHE_VERSION = 15;', 1))

          test = Path('tests/Unit/MatcherPerformanceRevisionTest.php')
          text = test.read_text()
          import_marker = 'use Infocyph\\Webrick\\Router\\Matching\\CompiledMatcherIndexCompiler;\n'
          if 'CompiledMatcherConstraintOpcode;' not in text:
              text = text.replace(
                  import_marker,
                  'use Infocyph\\Webrick\\Router\\Matching\\CompiledMatcherConstraintOpcode;\n' + import_marker,
                  1,
              )
          text = text.replace(
              "it('compiles safe regex routes into pcre steps and callable constraints into fallback steps', function (): void {",
              "it('compiles safe regex routes and specializes built-in callable fallback segments', function (): void {",
              1,
          )
          old_expect = """    expect($userSteps)->toHaveCount(1)\n        ->and($userSteps[0]['type'])->toBe('pcre')\n        ->and($orderSteps)->toHaveCount(1)\n        ->and($orderSteps[0]['type'])->toBe('fallback');\n"""
          new_expect = """    expect($userSteps)->toHaveCount(1)\n        ->and($userSteps[0]['type'])->toBe('pcre')\n        ->and($orderSteps)->toHaveCount(1)\n        ->and($orderSteps[0]['type'])->toBe('fallback')\n        ->and($orderSteps[0]['segments'][1]['type'])->toBe('op')\n        ->and($orderSteps[0]['segments'][1]['code'])->toBe(CompiledMatcherConstraintOpcode::DIGIT);\n"""
          if old_expect not in text:
              raise SystemExit('Test opcode expectation marker not found')
          text = text.replace(old_expect, new_expect, 1)
          text = text.replace(
              "it('keeps callable route constraints on the shared fallback lane', function (Closure $factory): void {",
              "it('dispatches built-in callable constraints through the specialized fallback lane', function (Closure $factory): void {",
              1,
          )
          marker = """it('uses method-first dynamic pcre buckets for overlapping route patterns', function (Closure $factory): void {\n"""
          added = """it('preserves every built-in callable constraint semantic through matcher opcodes', function (Closure $factory): void {\n    $cases = [\n        ['int', '123456', '12x456'],\n        ['digit', '123456', '12x456'],\n        ['numeric', '-123.45e2', '12x'],\n        ['float', '-123.45', '12x'],\n        ['alpha', 'Benchmark', 'Bench42'],\n        ['alnum', 'Bench42', 'Bench-42'],\n        ['bool', 'FALSE', 'maybe'],\n        ['json', '{\"ok\":true}', '{nope}'],\n        ['ipv6', '2001:db8::1', 'not-ipv6'],\n    ];\n\n    foreach ($cases as [$constraint, $hitValue, $missValue]) {\n        $route = matcherRevisionRoute('GET', "/typed/{$constraint}/{value:{$constraint}}");\n        $matcher = $factory();\n        $matcher->add($route);\n        $matcher->finalize();\n\n        expect($matcher->matchCompiled('GET', '*', "/typed/{$constraint}/{$hitValue}"))\n            ->toBe([$route->getIndex(), ['value' => $hitValue]]);\n\n        $miss = $matcher->matchCompiled('GET', '*', "/typed/{$constraint}/{$missValue}");\n        expect($miss)->toBeInstanceOf(MatchOutcome::class)\n            ->and($miss->type)->toBe(MatchOutcomeType::NOT_FOUND);\n    }\n})->with('compiled pcre ir matchers');\n\nit('keeps unrecognized callable segments on the generic callable fallback representation', function (): void {\n    $compiler = new CompiledMatcherIndexCompiler();\n    $reflection = new ReflectionClass($compiler);\n    $method = $reflection->getMethod('compileFallbackSegments');\n    $segments = $method->invoke(null, [\n        ['type' => 'lit', 'val' => 'custom'],\n        ['type' => 'var', 'name' => 'value', 'call' => 'strrev'],\n    ]);\n\n    expect($segments[1]['type'])->toBe('var')\n        ->and($segments[1]['call'])->toBe('strrev')\n        ->and($segments[1])->not->toHaveKey('code');\n});\n\n""" + marker
          if marker not in text:
              raise SystemExit('Test insertion marker not found')
          text = text.replace(marker, added, 1)
          text = text.replace('boots fused version 14 cache', 'boots fused version 15 cache', 1)
          text = text.replace('boots sharded version 14 cache', 'boots sharded version 15 cache', 1)
          test.write_text(text)
          PY

          cat > benchmarks/MatcherTypedConstraintBench.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Infocyph\Webrick\Benchmarks;

          use Infocyph\Webrick\Constants\MatcherModeEnum;
          use Infocyph\Webrick\Router\Matching\FusedMatcher;
          use Infocyph\Webrick\Router\Matching\GeneratedMatcher;
          use Infocyph\Webrick\Router\Matching\MatcherInterface;
          use Infocyph\Webrick\Router\Matching\ShardedMatcher;
          use Infocyph\Webrick\Router\Route\CompiledRoute;
          use Infocyph\Webrick\Router\Route\Route;
          use PhpBench\Attributes as Bench;

          /** End-to-end callable built-in constraint benchmark for matcher dispatch. */
          #[Bench\Groups(['matcher', 'matcher-typed-constraint'])]
          #[Bench\Iterations(5)]
          #[Bench\Revs(3000)]
          #[Bench\Warmup(1)]
          final class MatcherTypedConstraintBench
          {
              /** @var array<string,MatcherInterface> */
              private static array $matchers = [];

              #[Bench\ParamProviders('provideCases')]
              public function benchTypedConstraint(array $params): void
              {
                  self::matcher((string) $params['matcher'])
                      ->matchCompiled('GET', '*', (string) $params['path']);
              }

              /** @return iterable<string,array{matcher:string,path:string}> */
              public function provideCases(): iterable
              {
                  foreach ([
                      MatcherModeEnum::FUSED->value,
                      MatcherModeEnum::GENERATED->value,
                      MatcherModeEnum::SHARDED->value,
                  ] as $matcher) {
                      yield $matcher . '-int-hit' => ['matcher' => $matcher, 'path' => '/typed/int/123456'];
                      yield $matcher . '-int-miss' => ['matcher' => $matcher, 'path' => '/typed/int/12x456'];
                      yield $matcher . '-numeric-hit' => ['matcher' => $matcher, 'path' => '/typed/numeric/-123.45e2'];
                      yield $matcher . '-alpha-hit' => ['matcher' => $matcher, 'path' => '/typed/alpha/Benchmark'];
                      yield $matcher . '-alnum-hit' => ['matcher' => $matcher, 'path' => '/typed/alnum/Bench42'];
                      yield $matcher . '-bool-hit' => ['matcher' => $matcher, 'path' => '/typed/bool/FALSE'];
                      yield $matcher . '-json-hit' => ['matcher' => $matcher, 'path' => '/typed/json/{"ok":true}'];
                      yield $matcher . '-ipv6-hit' => ['matcher' => $matcher, 'path' => '/typed/ipv6/2001:db8::1'];
                  }
              }

              private static function matcher(string $mode): MatcherInterface
              {
                  if (isset(self::$matchers[$mode])) {
                      return self::$matchers[$mode];
                  }

                  $matcher = match ($mode) {
                      MatcherModeEnum::FUSED->value => FusedMatcher::make(),
                      MatcherModeEnum::GENERATED->value => GeneratedMatcher::make(),
                      MatcherModeEnum::SHARDED->value => ShardedMatcher::make(),
                      default => throw new \LogicException('Unsupported matcher mode.'),
                  };

                  $index = 0;
                  foreach (['int', 'numeric', 'alpha', 'alnum', 'bool', 'json', 'ipv6'] as $constraint) {
                      $matcher->add(CompiledRoute::fromRoute(
                          new Route('GET', "/typed/{$constraint}/{value:{$constraint}}", 'typed-handler'),
                          $index++,
                      ));
                  }
                  $matcher->finalize();

                  return self::$matchers[$mode] = $matcher;
              }
          }
          PHP
      - name: Apply PHPForge style
        run: |
          vendor/bin/pint \
            --config=vendor/infocyph/phpforge/resources/pint.json \
            src/Router/Matching/CompiledMatcherConstraintOpcode.php \
            src/Router/Matching/CompiledMatcherIndexCompiler.php \
            src/Router/Matching/CompiledMatcherDynamicEngine.php \
            src/Router/Matching/CompactMatcherDynamicValidator.php \
            src/Router/Matching/FusedMatcher.php \
            src/Router/Matching/ShardedMatcher.php \
            tests/Unit/MatcherPerformanceRevisionTest.php \
            benchmarks/MatcherTypedConstraintBench.php
      - name: Syntax check Phase 3 PHP
        run: |
          php -l src/Router/Matching/CompiledMatcherConstraintOpcode.php
          php -l src/Router/Matching/CompiledMatcherIndexCompiler.php
          php -l src/Router/Matching/CompiledMatcherDynamicEngine.php
          php -l src/Router/Matching/CompactMatcherDynamicValidator.php
          php -l src/Router/Matching/FusedMatcher.php
          php -l src/Router/Matching/ShardedMatcher.php
          php -l tests/Unit/MatcherPerformanceRevisionTest.php
          php -l benchmarks/MatcherTypedConstraintBench.php
      - name: Run complete PHPForge CI gate
        run: composer ic:ci
      - name: Run typed constraint benchmark
        run: vendor/bin/phpbench run benchmarks/MatcherTypedConstraintBench.php --bootstrap=vendor/autoload.php --report=aggregate
      - name: Run matcher outcome regression benchmark
        run: vendor/bin/phpbench run benchmarks/MatcherOutcomeBench.php --bootstrap=vendor/autoload.php --report=aggregate
      - name: Run matcher scale regression benchmark
        run: vendor/bin/phpbench run benchmarks/MatcherScaleBench.php --bootstrap=vendor/autoload.php --report=aggregate
      - name: Commit Phase 3 implementation and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_tmp-matcher-phase3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/Router/Matching/CompiledMatcherConstraintOpcode.php \
            src/Router/Matching/CompiledMatcherIndexCompiler.php \
            src/Router/Matching/CompiledMatcherDynamicEngine.php \
            src/Router/Matching/CompactMatcherDynamicValidator.php \
            src/Router/Matching/FusedMatcher.php \
            src/Router/Matching/ShardedMatcher.php \
            tests/Unit/MatcherPerformanceRevisionTest.php \
            benchmarks/MatcherTypedConstraintBench.php \
            .github/workflows/_tmp-matcher-phase3.yml
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "perf: specialize matcher built-in constraints"
          git push origin HEAD:webrick-5/batch-1-correctness
