name: "Webrick QA Diagnostics"

on:
  push:
    branches: [ "webrick-5/batch-1-correctness" ]

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Apply one-shot PHPDoc parameter repair
        id: phpdoc_fix
        continue-on-error: true
        if: "${{ github.event.head_commit.message != 'docs: normalize PHPDoc parameter tags' }}"
        shell: bash
        run: |
          set +e
          php tools/fix_phpdoc_params.php 2>&1 | tee phpdoc-fix.txt
          fixer_status=${PIPESTATUS[0]}
          set -e
          printf '%d\n' "$fixer_status" > phpdoc-fix.status
          if [ "$fixer_status" -ne 0 ]; then
            exit "$fixer_status"
          fi
          if git diff --quiet -- benchmark benchmarks src routes.php index.php; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark benchmarks src routes.php index.php 2>/dev/null || true
          git commit -m "docs: normalize PHPDoc parameter tags"
          git push origin HEAD:webrick-5/batch-1-correctness

      - name: Upload PHPDoc fixer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpdoc-fixer-diagnostics
          path: |
            phpdoc-fix.txt
            phpdoc-fix.status

      - name: Collect strict diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          php vendor/bin/phpstan analyse \
            --configuration=vendor/infocyph/phpforge/resources/phpstan.neon.dist \
            --memory-limit=1G \
            --no-progress \
            --error-format=table 2>&1 | tee phpstan.txt
          phpstan_status=${PIPESTATUS[0]}

          composer ic:test:comments 2>&1 | tee comments.txt
          comments_status=${PIPESTATUS[0]}
          set -e

          printf '%d\n' "$phpstan_status" > phpstan.status
          printf '%d\n' "$comments_status" > comments.status

      - name: Upload strict diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-diagnostics
          path: |
            phpstan.txt
            comments.txt
            phpstan.status
            comments.status

      - name: Enforce strict diagnostics
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.phpdoc_fix.outcome }}" = "failure" ]; then
            exit 1
          fi
          phpstan_status="$(cat phpstan.status)"
          comments_status="$(cat comments.status)"
          if [ "$phpstan_status" -ne 0 ] || [ "$comments_status" -ne 0 ]; then
            exit 1
          fi
