name: Temporary Matcher Phase 9

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  phase9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Measure Fused and Generated crossover
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/phase9-crossover.jsonl
          for routes in 1000 1250 1500 1750 2000 2250 2500 2750 3000 3500 4000 4500 5000; do
            for pass in 1 2 3; do
              php benchmark/matcher_envelope.php --matcher=fused --routes="$routes" --warm-iters=25000 | tee -a /tmp/phase9-crossover.jsonl
              php benchmark/matcher_envelope.php --matcher=generated --routes="$routes" --warm-iters=25000 | tee -a /tmp/phase9-crossover.jsonl
            done
          done

      - name: Summarize crossover
        run: python3 .github/scripts/_tmp_matcher_phase9.py /tmp/phase9-crossover.jsonl

      - name: Remove temporary crossover runner
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-matcher-phase9.yml
          rm -f .github/scripts/_tmp_matcher_phase9.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "bench: complete generated matcher crossover study"
          git push origin HEAD:webrick-5/batch-1-correctness
