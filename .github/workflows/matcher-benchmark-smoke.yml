name: Matcher Benchmark Smoke

on:
  push:
    branches:
      - webrick-5/batch-1-correctness
    paths:
      - 'src/Router/Matching/**'
      - 'src/Router/Constraint/**'
      - 'benchmark/fastroute_reference.php'
      - 'benchmark/matcher_sanity.php'
      - 'benchmark/matcher_tuning.php'
      - 'benchmark/matcher_profile.php'
      - 'benchmark/matcher_capabilities.php'
      - '.github/workflows/matcher-benchmark-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Matcher semantic sanity
        run: php benchmark/matcher_sanity.php
      - name: Reference smoke
        run: php benchmark/fastroute_reference.php --routes=1000 --iters=5000 --rounds=3 --warmup=1000 | tee matcher-smoke.txt
      - name: Capability smoke
        run: php benchmark/matcher_capabilities.php --routes=1000 --iters=3000 --rounds=3 --warmup=500 | tee matcher-capabilities.txt
      - name: Chunk/static tuning
        run: php benchmark/matcher_tuning.php --routes=1000 --iters=3000 --rounds=5 | tee matcher-tuning.txt
      - name: Cache/working-set profile
        run: php benchmark/matcher_profile.php --routes=5000 --warm-iters=10000 | tee matcher-profile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matcher-benchmark-smoke
          path: matcher-*.txt
          if-no-files-found: warn
