name: Foundation Webrick Bridge Validation

on:
  push:
    branches:
      - featurre/foundation-wb-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Syntax check bridge changes
        run: |
          for file in \
            src/Router/Build/Artifact/ArtifactValueCodec.php \
            src/Router/Build/CompiledRouterArtifact.php \
            src/Router/Build/HandlerCompiler.php \
            src/Router/Build/ReleaseCompiler.php \
            src/Router/Dispatch/CompiledMiddlewarePipeline.php \
            src/Router/Dispatch/MiddlewareAliases.php \
            src/Router/Dispatch/RuntimeMiddlewareDescriptor.php \
            src/Router/Kernel/CompiledRouterKernel.php \
            src/Router/Kernel/RouterKernel.php \
            src/Router/Kernel/RoutingControlRenderer.php \
            src/Router/Kernel/RoutingControlRendererInterface.php \
            tests/Integration/FoundationBridgeTest.php; do
            php -l "$file"
          done

      - name: Run Foundation bridge integration tests
        run: vendor/bin/pest tests/Integration/FoundationBridgeTest.php --ci

      - name: Run full Webrick suite
        run: vendor/bin/pest --ci
