name: Foundation Webrick Bridge Validation

on:
  push:
    branches:
      - featurre/foundation-wb-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Syntax ArtifactValueCodec
        continue-on-error: true
        run: php -l src/Router/Build/Artifact/ArtifactValueCodec.php
      - name: Syntax CompiledRouterArtifact
        continue-on-error: true
        run: php -l src/Router/Build/CompiledRouterArtifact.php
      - name: Syntax HandlerCompiler
        continue-on-error: true
        run: php -l src/Router/Build/HandlerCompiler.php
      - name: Syntax ReleaseCompiler
        continue-on-error: true
        run: php -l src/Router/Build/ReleaseCompiler.php
      - name: Syntax CompiledMiddlewarePipeline
        continue-on-error: true
        run: php -l src/Router/Dispatch/CompiledMiddlewarePipeline.php
      - name: Syntax MiddlewareAliases
        continue-on-error: true
        run: php -l src/Router/Dispatch/MiddlewareAliases.php
      - name: Syntax RuntimeMiddlewareDescriptor
        continue-on-error: true
        run: php -l src/Router/Dispatch/RuntimeMiddlewareDescriptor.php
      - name: Syntax CompiledRouterKernel
        continue-on-error: true
        run: php -l src/Router/Kernel/CompiledRouterKernel.php
      - name: Syntax RouterKernel
        continue-on-error: true
        run: php -l src/Router/Kernel/RouterKernel.php
      - name: Syntax RoutingControlRenderer
        continue-on-error: true
        run: php -l src/Router/Kernel/RoutingControlRenderer.php
      - name: Syntax RoutingControlRendererInterface
        continue-on-error: true
        run: php -l src/Router/Kernel/RoutingControlRendererInterface.php
      - name: Syntax FoundationBridgeTest
        continue-on-error: true
        run: php -l tests/Integration/FoundationBridgeTest.php

      - name: Run Foundation bridge integration tests
        run: vendor/bin/pest tests/Integration/FoundationBridgeTest.php --ci

      - name: Run full Webrick suite
        run: vendor/bin/pest --ci
