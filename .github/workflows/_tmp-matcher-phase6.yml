name: Temporary Matcher Phase 6

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Benchmark chunk 48
        run: vendor/bin/phpbench run benchmarks/MatcherPcrePolicyBench.php --bootstrap=vendor/autoload.php --report=aggregate | tee /tmp/phase6-48.txt

      - name: Benchmark chunk 24
        run: |
          python3 .github/scripts/_tmp_matcher_phase6.py set 24
          vendor/bin/phpbench run benchmarks/MatcherPcrePolicyBench.php --bootstrap=vendor/autoload.php --report=aggregate | tee /tmp/phase6-24.txt

      - name: Benchmark chunk 96
        run: |
          python3 .github/scripts/_tmp_matcher_phase6.py set 96
          vendor/bin/phpbench run benchmarks/MatcherPcrePolicyBench.php --bootstrap=vendor/autoload.php --report=aggregate | tee /tmp/phase6-96.txt

      - name: Select PCRE policy
        run: |
          python3 .github/scripts/_tmp_matcher_phase6.py decide
          python3 .github/scripts/_tmp_matcher_phase6.py record
          vendor/bin/pint --config=vendor/infocyph/phpforge/resources/pint.json \
            src/Router/Matching/CompiledMatcherIndexCompiler.php \
            src/Router/Matching/FusedMatcher.php \
            src/Router/Matching/ShardedMatcher.php \
            benchmarks/MatcherPcrePolicyBench.php

      - name: Run Phase 6 full quality gate
        run: composer ic:ci

      - name: Run selected PCRE policy benchmark
        run: vendor/bin/phpbench run benchmarks/MatcherPcrePolicyBench.php --bootstrap=vendor/autoload.php --report=aggregate

      - name: Run Phase 6 regression benchmarks
        run: |
          vendor/bin/phpbench run benchmarks/MatcherOutcomeBench.php --bootstrap=vendor/autoload.php --report=aggregate
          vendor/bin/phpbench run benchmarks/MatcherScaleBench.php --bootstrap=vendor/autoload.php --report=aggregate

      - name: Commit Phase 6 and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-matcher-phase6.yml
          rm -f .github/scripts/_tmp_matcher_phase6.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "perf: complete matcher PCRE policy phase"
          git push origin HEAD:webrick-5/batch-1-correctness
