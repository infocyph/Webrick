name: Temporary Matcher Docs Cleanup

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
          fetch-depth: 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Apply matcher documentation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/comparison + fused_header/comparison/' .github/scripts/_tmp_update_matcher_docs_cleanup.py
          sed -i 's/generated + sharded_header/generated/' .github/scripts/_tmp_update_matcher_docs_cleanup.py
          sed -i 's/sharded + shared_header/sharded/' .github/scripts/_tmp_update_matcher_docs_cleanup.py
          sed -i 's/modes + php_header/modes/' .github/scripts/_tmp_update_matcher_docs_cleanup.py
          python3 .github/scripts/_tmp_update_matcher_docs_cleanup.py

      - name: Validate cleanup and documentation references
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e MATCHER_OPTIMIZATION_PLAN.md
          test ! -e docs/recipes/pagination.rst
          test ! -e docs/recipes/search.rst
          test ! -e docs/recipes/testing.rst
          test ! -e docs/recipes/webhooks.rst
          ! git grep -n 'MATCHER_OPTIMIZATION_PLAN'
          ! grep -RniE '<\./(pagination|search|testing|webhooks)\.rst>|^   (pagination|search|testing|webhooks)$' docs/recipes
          grep -F 'Strong measured candidate through roughly **1,500 routes**' docs/reference/matcher.rst
          grep -F 'about **69.001 µs**' docs/reference/matcher.rst
          grep -F 'simple-route wins into the low thousands' docs/index.rst

      - name: Build Sphinx docs with warnings as errors
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs /tmp/webrick-docs

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run complete PHPForge gate
        run: composer ic:ci

      - name: Commit documentation cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f composer.lock
          rm -f .github/workflows/_tmp-update-matcher-docs-cleanup.yml
          rm -f .github/scripts/_tmp_update_matcher_docs_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "docs: align matcher guidance and remove stale files"
          git push origin HEAD:webrick-5/batch-1-correctness
