name: Temporary final docs validation

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Clean remaining converted internal links
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              'docs/reference/router.rst': {
                  '<matcher.md>': '<matcher.rst>',
                  '<route-cache.md>': '<route-cache.rst>',
                  '<middleware.md>': '<middleware.rst>',
                  '<emitters.md>': '<emitters.rst>',
              },
              'docs/getting-started/installation.rst': {
                  '<quickstart.md>': '<quickstart.rst>',
                  '<framework-integration.md>': '<framework-integration.rst>',
              },
              'docs/getting-started/quickstart.rst': {
                  '<framework-integration.md>': '<framework-integration.rst>',
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          path = Path('docs/middleware/overview.rst')
          text = path.read_text(encoding='utf-8')
          names = [
              'compression', 'cache-validators', 'vary-accumulator', 'cors-and-policies',
              'throttle', 'request-limits', 'cookie-encryption', 'maintenance-mode',
              'telemetry', 'input-sanitizer', 'negotiation', 'response-cache', 'response-linter',
          ]
          start = text.index('Deep dives\n----------')
          replacement = '''Deep dives
----------

- :doc:`compression`
- :doc:`cache-validators`
- :doc:`vary-accumulator`
- :doc:`cors-and-policies`
- :doc:`throttle`
- :doc:`request-limits`
- :doc:`cookie-encryption`
- :doc:`maintenance-mode`
- :doc:`telemetry`
- :doc:`input-sanitizer`
- :doc:`negotiation`
- :doc:`response-cache`
- :doc:`response-linter`
'''
          text = text[:start] + replacement
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate documentation tree and source references
        shell: bash
        run: |
          set -euo pipefail

          if find docs -type f -name '*.md' -print -quit | grep -q .; then
            find docs -type f -name '*.md' -print >&2
            exit 1
          fi

          if find docs -maxdepth 1 -type f -name 'webrick-5-*' -print -quit | grep -q .; then
            find docs -maxdepth 1 -type f -name 'webrick-5-*' -print >&2
            exit 1
          fi

          if grep -RIn --include='*.rst' -E '<[^>]*\.md>' docs; then
            echo 'Internal Markdown link targets remain.' >&2
            exit 1
          fi

          if grep -RIn --include='*.rst' -E 'TraceContext::(get[A-Z]|isAvailable|isOtelMode|isSampled)' docs; then
            echo 'Removed process-global TraceContext API remains documented.' >&2
            exit 1
          fi

          if grep -RIn --include='*.rst' -E 'Request::createFromGlobals|capturePhpErrors|fallbackAliasesFromRegistrar' docs; then
            echo 'Removed API/options remain documented.' >&2
            exit 1
          fi

          if grep -RIn --include='*.rst' -E 'next major release|Major release' docs; then
            echo 'Obsolete major-release wording remains.' >&2
            exit 1
          fi

          if grep -nE 'myst_parser|myst_enable_extensions|myst_heading_anchors' docs/conf.py; then
            exit 1
          fi
          if grep -nE '^(myst-parser|linkify-it-py)' docs/requirements.txt; then
            exit 1
          fi

          python <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False
          for doc in sorted(Path('docs').rglob('*.rst')):
              lines = doc.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if 'RouterKernel::bootWithRegistrar(' not in line or '=' not in line:
                      continue
                  depth = line.count('(') - line.count(')')
                  block = [line]
                  j = i + 1
                  while j < len(lines) and depth > 0:
                      block.append(lines[j])
                      depth += lines[j].count('(') - lines[j].count(')')
                      j += 1
                  text = '\n'.join(block)
                  if 'invoker:' not in text:
                      failed = True
                      print(f'{doc}:{i+1}: missing mandatory invoker')
                  for removed in ('routeCache:', 'capturePhpErrors:', 'fallbackAliasesFromRegistrar:'):
                      if removed in text:
                          failed = True
                          print(f'{doc}:{i+1}: removed RouterKernel option {removed}')

          # Validate explicit Webrick imports in PHP examples against src/.
          import_re = re.compile(r'^\s*use\s+Infocyph\\\\Webrick\\\\([A-Za-z0-9_\\\\]+)(?:\s+as\s+[A-Za-z0-9_]+)?;', re.MULTILINE)
          for doc in sorted(Path('docs').rglob('*.rst')):
              text = doc.read_text(encoding='utf-8')
              for match in import_re.finditer(text):
                  rel = Path(*match.group(1).split('\\\\')).with_suffix('.php')
                  if not (Path('src') / rel).is_file():
                      failed = True
                      line = text.count('\n', 0, match.start()) + 1
                      print(f'{doc}:{line}: missing source for Infocyph\\Webrick\\{match.group(1)}')

          if failed:
              sys.exit(1)
          PY

          echo "RST files: $(find docs -type f -name '*.rst' | wc -l)"

      - name: Build Read the Docs sources with warnings as errors
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r docs/requirements.txt
          WEBRICK_DOCS_OFFLINE=1 python -m sphinx -W --keep-going -b html docs /tmp/webrick-docs-html

      - name: Commit final documentation cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: finalize native RST documentation cleanup'
          git push origin HEAD:webrick-5/batch-1-correctness
