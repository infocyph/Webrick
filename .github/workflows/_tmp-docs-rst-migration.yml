name: Temporary docs API audit

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Audit development boot examples
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          for doc in sorted(Path('docs').rglob('*.rst')):
              lines = doc.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if 'RouterKernel::bootWithRegistrar(' not in line:
                      continue
                  depth = line.count('(') - line.count(')')
                  block = [line]
                  j = i + 1
                  while j < len(lines) and depth > 0:
                      block.append(lines[j])
                      depth += lines[j].count('(') - lines[j].count(')')
                      j += 1
                  text = '\n'.join(block)
                  flags = []
                  if 'invoker:' not in text:
                      flags.append('MISSING invoker')
                  if 'routeCache:' in text:
                      flags.append('INVALID routeCache')
                  if 'capturePhpErrors:' in text:
                      flags.append('INVALID capturePhpErrors')
                  if flags:
                      print(f'{doc}:{i+1}: {", ".join(flags)}')
                      print(text)
                      print('---')

          print('=== REMOVED TRACE CONTEXT STATIC API ===')
          old = ('TraceContext::get', 'TraceContext::isAvailable', 'TraceContext::isOtelMode', 'TraceContext::isSampled')
          for doc in sorted(Path('docs').rglob('*.rst')):
              for no, line in enumerate(doc.read_text(encoding='utf-8').splitlines(), 1):
                  if any(token in line for token in old):
                      print(f'{doc}:{no}: {line.strip()}')
          PY
