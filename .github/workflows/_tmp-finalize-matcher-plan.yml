name: Temporary Finalize Matcher Plan

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - name: Finalize matcher optimization plan
        run: |
          python3 .github/scripts/_tmp_finalize_matcher_plan.py
          sed -i 's/Status: complete — Phases 1–9 closed (2026-09-01)  $/Status: complete — Phases 1–9 closed (2026-09-01)/' MATCHER_OPTIMIZATION_PLAN.md
      - name: Validate plan diff
        run: |
          git diff --check
          grep -F 'Status: complete — Phases 1–9 closed (2026-09-01)' MATCHER_OPTIMIZATION_PLAN.md
          grep -F 'Status: complete (2026-09-01) — the retained shared compact IR was already the Fused production representation.' MATCHER_OPTIMIZATION_PLAN.md
          grep -F 'Status: complete (2026-09-01) — shared IR retained and cached candidate-group memoization landed.' MATCHER_OPTIMIZATION_PLAN.md
          grep -F 'Status: complete (2026-09-01) — retain Generated as an explicit small-route specialization.' MATCHER_OPTIMIZATION_PLAN.md
      - name: Commit final plan and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-finalize-matcher-plan.yml
          rm -f .github/scripts/_tmp_finalize_matcher_plan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "docs: close matcher optimization phases"
          git push origin HEAD:webrick-5/batch-1-correctness
