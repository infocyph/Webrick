name: "Security & Standards"

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]
  workflow_dispatch:

env:
  PHP_VERSIONS_JSON: '["8.4", "8.5"]'

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: ${{ fromJson(env.PHP_VERSIONS_JSON) }}
        dependency-version: [ prefer-lowest, prefer-stable ]

    name: PHP ${{ matrix.php-versions }} - ${{ matrix.operating-system }} - ${{ matrix.dependency-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          coverage: xdebug

      - name: Check PHP Version
        run: php -v

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Package Audit
        run: composer audit

      - name: Test
        run: composer tests

  analyze:
    name: Security Analysis (CodeQL) - PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ${{ fromJson(env.PHP_VERSIONS_JSON) }}
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2

      - name: Composer Audit (CVE check)
        run: composer audit --locked --no-interaction

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'php'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
