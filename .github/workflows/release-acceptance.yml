name: Webrick 6.1 — Full Runtime Release Acceptance

# Compare the exact candidate SHA against the immutable 6.0.4 release tag.
# Keep expensive release certification independent from ordinary PR QA.
# A/A calibrates a measurement environment, not a pull request; its separate
# manually triggered workflow is .github/workflows/http-aa-control.yml.
# Do not block the actual A/B comparison on source-identical A/A variability.
on:
  push:
    branches:
      - feature/risk-admission
    paths:
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - ".github/certification/**"
      - ".github/workflows/runtime-release-certification.yml"
      - ".github/workflows/release-acceptance.yml"
      # CI policy changes can alter the final release qualification gates.
      - ".github/workflows/security-standards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-release:
    name: Webrick 6.0.4 vs candidate runtime and release certification
    uses: ./.github/workflows/runtime-release-certification.yml
    with:
      aa_control: false
      benchmark_cpu_isolation: true
