name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpforge:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      integration_services: '[]'
      service_topologies: '{}'
      php_extensions: intl,brotli,zstd
    permissions:
      security-events: write
      actions: read
      contents: read

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}


  detail-diagnostics:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: PHPForge detail diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl,brotli,zstd
          tools: composer:v2
      - name: Verify optional codec extensions in detail diagnostics
        run: >-
          php -r 'foreach (["intl", "brotli", "zstd"] as $extension) {
            if (!extension_loaded($extension)) {
              fwrite(STDERR, "Missing PHP extension: {$extension}\n");
              exit(1);
            }
          }
          foreach (["brotli_compress", "brotli_uncompress", "zstd_compress", "zstd_uncompress"] as $function) {
            if (!function_exists($function)) {
              fwrite(STDERR, "Missing PHP codec function: {$function}\n");
              exit(1);
            }
          }'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verify InputSanitizer without ext-intl
        run: >-
          php -n -r 'require "src/Support/InputSanitizer.php";
          $sanitizer = new Infocyph\Webrick\Support\InputSanitizer(normalizeUnicode: true);
          if ($sanitizer->sanitizeString("Ｆｏｏ") !== "Ｆｏｏ") {
              fwrite(STDERR, "Unicode normalization must remain optional without ext-intl.\n");
              exit(1);
          }'
      - name: Run exact PHPForge detail suite
        run: composer ic:test:details
