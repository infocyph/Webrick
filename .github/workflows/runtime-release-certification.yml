name: Runtime Release Certification

on:
  push:
    branches:
      - feature/runwire
    paths:
      - .github/workflows/runtime-release-certification.yml
      - .github/certification/**
      - docs/plans/webrick-6-audit-and-runwire-2.1-plan.md
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Webrick baseline ref for same-run comparison
        required: true
        default: "5.4"
        type: string
      candidate_ref:
        description: Candidate ref; leave empty to certify the dispatched SHA
        required: false
        default: ""
        type: string
      duration_seconds:
        description: Seconds per steady-state HTTP load trial
        required: true
        default: "10"
        type: string
      trials:
        description: Steady-state trials per workload/concurrency
        required: true
        default: "3"
        type: string
      soak_minutes:
        description: Persistent-worker soak duration in minutes
        required: true
        default: "30"
        type: string
      throughput_regression_percent:
        description: Maximum median RPM regression versus 5.4
        required: true
        default: "2"
        type: string
      p99_regression_percent:
        description: Maximum median p99 regression versus 5.4
        required: true
        default: "15"
        type: string
      memory_regression_mb:
        description: Maximum candidate RSS/memory growth in MiB
        required: true
        default: "32"
        type: string
      run_http3:
        description: Also run deployment-specific H3 certification on a prepared self-hosted Linux QUIC runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-release-certification-${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  live-runwire-h1-h2:
    name: Live Runwire H1/H2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install certification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq nghttp2-client openssl
          composer install --no-interaction --no-progress --prefer-dist

      - name: Build certification artifacts
        run: php .github/certification/cert-server.php prepare --root="$PWD"

      - name: Generate local TLS identity
        run: |
          mkdir -p .runtime-certification/tls
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes             -keyout .runtime-certification/tls/key.pem             -out .runtime-certification/tls/cert.pem             -days 1 -subj "/CN=localhost"

      - name: Start live Runwire server
        run: |
          php .github/certification/cert-server.php runwire             --root="$PWD"             --address=127.0.0.1:18443             --tls-cert="$PWD/.runtime-certification/tls/cert.pem"             --tls-key="$PWD/.runtime-certification/tls/key.pem"             > .runtime-certification/live-runwire.log 2>&1 &
          echo "RUNWIRE_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..80}; do
            if curl -kfsS --http1.1 https://127.0.0.1:18443/cert/static >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.25
          done
          cat .runtime-certification/live-runwire.log
          exit 1

      - name: Certify HTTP/1.1 semantics
        run: |
          request_ok() {
            local name="$1"
            local url="$2"
            shift 2
            local body=".runtime-certification/${name}.body"
            local status
            status="$(curl -k -sS --http1.1 -o "$body" -w '%{http_code}' "$@" "$url")"
            if [[ "$status" != "200" && "$status" != "206" ]]; then
              echo "${name} returned HTTP ${status}" >&2
              cat "$body" >&2 || true
              exit 1
            fi
            cat "$body"
          }

          body="$(request_ok json https://127.0.0.1:18443/cert/json)"
          [[ "$(jq -r '.ok' <<<"$body")" == "true" ]]
          [[ "$(jq -r '.protocol' <<<"$body")" == "1.1" ]]
          [[ "$(request_ok stream https://127.0.0.1:18443/cert/stream | wc -c | tr -d ' ')" == "3072" ]]
          [[ "$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/cert/missing)" == "404" ]]
          [[ "$(curl -ksS -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:18443/cert/static)" == "405" ]]
          head -c 16384 /dev/zero > .runtime-certification/upload.bin
          upload="$(request_ok upload https://127.0.0.1:18443/cert/upload --data-binary @.runtime-certification/upload.bin)"
          [[ "$(jq -r '.bytes' <<<"$upload")" == "16384" ]]
          [[ "$(request_ok range https://127.0.0.1:18443/cert/file -H 'Range: bytes=0-15' | wc -c | tr -d ' ')" == "16" ]]

      - name: Certify multiplexed HTTP/2
        run: |
          response="$(curl -kfsS --http2 https://127.0.0.1:18443/cert/json)"
          [[ "$(jq -r '.ok' <<<"$response")" == "true" ]]
          [[ "$(jq -r '.protocol' <<<"$response")" == "2" ]]
          h2load -n 500 -c 20 -m 10 https://127.0.0.1:18443/cert/static             | tee .runtime-certification/h2load.txt
          grep -Eq '0 failed, 0 errored' .runtime-certification/h2load.txt

      - name: Verify runtime drains after protocol load
        run: |
          curl -kfsS --http1.1 https://127.0.0.1:18443/__cert/metrics             | tee .runtime-certification/live-metrics.json
          jq -e '(.queued_bytes_current // 0) == 0' .runtime-certification/live-metrics.json
          jq -e '(.rejected_requests_total // 0) == 0' .runtime-certification/live-metrics.json

      - name: Stop live Runwire server
        if: always()
        run: |
          if [[ -n "${RUNWIRE_PID:-}" ]] && kill -0 "$RUNWIRE_PID" 2>/dev/null; then
            kill -TERM "$RUNWIRE_PID"
            for attempt in {1..120}; do
              if ! kill -0 "$RUNWIRE_PID" 2>/dev/null; then
                wait "$RUNWIRE_PID" 2>/dev/null || true
                exit 0
              fi
              sleep 0.25
            done
            kill -KILL "$RUNWIRE_PID" 2>/dev/null || true
            exit 1
          fi

      - name: Upload live protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-runwire-h1-h2
          path: .runtime-certification/
          if-no-files-found: error
          include-hidden-files: true

  same-run-performance:
    name: Webrick 5.4 vs 6.0 HTTP performance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate
          fetch-depth: 0

      - name: Check out baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref || '5.4' }}
          path: baseline
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install load tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq wrk
          composer install --working-dir=candidate --no-interaction --no-progress --prefer-dist
          composer install --working-dir=baseline --no-interaction --no-progress --prefer-dist

      - name: Prove analyzer rejects incomplete evidence
        run: |
          mkdir -p analyzer-negative
          cat > analyzer-negative/bad.jsonl <<'JSONL'
          {"version":"baseline","mode":"sapi","workload":"static","concurrency":1,"trial":1,"rps":100,"complete":10,"validated":9,"invalid":1,"failed":0,"non2xx":0,"socket_errors":{"connect":0,"read":0,"write":0,"timeout":0},"p99":1,"rss_kb":1024,"metrics":{}}
          {"version":"candidate","mode":"sapi","workload":"static","concurrency":1,"trial":1,"rps":100,"complete":10,"validated":9,"invalid":1,"failed":0,"non2xx":0,"socket_errors":{"connect":0,"read":0,"write":0,"timeout":0},"p99":1,"rss_kb":1024,"metrics":{}}
          JSONL
          if php candidate/.github/certification/analyze-load.php             --input="$PWD/analyzer-negative/bad.jsonl"             --summary="$PWD/analyzer-negative/summary.md"             --json="$PWD/analyzer-negative/report.json"             --throughput-regression-percent=100             --p99-regression-percent=100             --memory-regression-mb=128; then
            echo "Analyzer accepted deliberately incomplete certification evidence." >&2
            exit 1
          fi

      - name: Run controlled same-run load matrix
        run: |
          mkdir -p cert-results
          bash candidate/.github/certification/load-benchmark.sh             "$PWD/baseline"             "$PWD/candidate"             "$PWD/cert-results"             "${{ github.event_name == 'workflow_dispatch' && inputs.duration_seconds || '2' }}"             "${{ github.event_name == 'workflow_dispatch' && inputs.trials || '1' }}"

      - name: Enforce performance budgets
        run: |
          php candidate/.github/certification/analyze-load.php             --input="$PWD/cert-results/load-results.jsonl"             --summary="$PWD/cert-results/summary.md"             --json="$PWD/cert-results/comparison.json"             --throughput-regression-percent="${{ github.event_name == 'workflow_dispatch' && inputs.throughput_regression_percent || '100' }}"             --p99-regression-percent="${{ github.event_name == 'workflow_dispatch' && inputs.p99_regression_percent || '1000' }}"             --memory-regression-mb="${{ github.event_name == 'workflow_dispatch' && inputs.memory_regression_mb || '128' }}"
          cat cert-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrick-5.4-vs-6.0-http
          path: cert-results/
          if-no-files-found: error

  persistent-worker-soak:
    name: Persistent Runwire worker soak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install soak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq wrk
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run persistent-worker soak
        run: |
          mkdir -p soak-results
          bash .github/certification/run-soak.sh             "$PWD"             "$PWD/soak-results"             "${{ github.event_name == 'workflow_dispatch' && inputs.soak_minutes || '2' }}"             "${{ github.event_name == 'workflow_dispatch' && inputs.memory_regression_mb || '128' }}"
          cat soak-results/soak-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-runwire-soak
          path: soak-results/
          if-no-files-found: error

  live-runwire-h3:
    name: Live Runwire H3
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Install QUIC and HTTP/3 certification tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime-certification
          php -v > .runtime-certification/php-environment.txt
          openssl version >> .runtime-certification/php-environment.txt
          sudo apt-get update
          sudo apt-get install -y python3-aioquic jq openssl
          curl -fL --output /tmp/pie https://github.com/php/pie/releases/latest/download/pie-Linux-X64
          gh attestation verify --owner php /tmp/pie
          chmod +x /tmp/pie
          sudo mv /tmp/pie /usr/local/bin/pie
          sudo -E /usr/local/bin/pie install \
            --with-php-path="$(command -v php)" \
            --with-php-config="$(command -v php-config)" \
            --with-phpize-path="$(command -v phpize)" \
            mikepultz/php-quic
          php -r '
          if (!extension_loaded("quic")) {
              throw new RuntimeException("ext-quic did not load.");
          }
          if (OPENSSL_VERSION_NUMBER < 0x30500000) {
              throw new RuntimeException("OpenSSL 3.5+ is required for QUIC server support.");
          }
          fwrite(STDOUT, PHP_VERSION . " " . OPENSSL_VERSION_TEXT . PHP_EOL);
          '

      - name: Install candidate dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build certification artifacts and TLS identity
        run: |
          php .github/certification/cert-server.php prepare --root="$PWD"
          mkdir -p .runtime-certification/tls
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes             -keyout .runtime-certification/tls/key.pem             -out .runtime-certification/tls/cert.pem             -days 1 -subj "/CN=localhost"

      - name: Start H3-capable Runwire server
        run: |
          php .github/certification/cert-server.php runwire             --root="$PWD"             --address=127.0.0.1:18444             --tls-cert="$PWD/.runtime-certification/tls/cert.pem"             --tls-key="$PWD/.runtime-certification/tls/key.pem"             --http3=1             > .runtime-certification/live-h3.log 2>&1 &
          echo "RUNWIRE_H3_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..160}; do
            if python3 .github/certification/http3-client.py 18444 /cert/static >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.25
          done
          cat .runtime-certification/live-h3.log
          exit 1

      - name: Certify real HTTP/3
        run: |
          python3 .github/certification/http3-client.py 18444 /cert/json             | tee .runtime-certification/h3-json.txt
          jq -e '.ok == true' .runtime-certification/h3-json.txt
          jq -e '.protocol | tostring | startswith("3")' .runtime-certification/h3-json.txt

          python3 .github/certification/http3-client.py 18444 /cert/stream             > .runtime-certification/h3-stream.bin
          [[ "$(wc -c < .runtime-certification/h3-stream.bin | tr -d ' ')" == "3072" ]]

          python3 .github/certification/http3-client.py 18444 /cert/static 100             > .runtime-certification/h3-static.txt
          [[ "$(cat .runtime-certification/h3-static.txt)" == "webrick-cert-ok" ]]

      - name: Stop H3 Runwire server
        if: always()
        run: |
          if [[ -n "${RUNWIRE_H3_PID:-}" ]] && kill -0 "$RUNWIRE_H3_PID" 2>/dev/null; then
            kill -TERM "$RUNWIRE_H3_PID"
            for attempt in {1..120}; do
              if ! kill -0 "$RUNWIRE_H3_PID" 2>/dev/null; then
                wait "$RUNWIRE_H3_PID" 2>/dev/null || true
                exit 0
              fi
              sleep 0.25
            done
            kill -KILL "$RUNWIRE_H3_PID" 2>/dev/null || true
            exit 1
          fi

      - name: Upload H3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-runwire-h3
          path: .runtime-certification/
          if-no-files-found: error
          include-hidden-files: true

  live-runwire-h3-linux:
    name: Live Runwire H3 (Linux deployment)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_http3 }}
    runs-on: [self-hosted, linux, x64, runwire-quic]
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Assert prepared QUIC host
        run: |
          php -r 'if (!extension_loaded("quic")) { throw new RuntimeException("ext-quic is unavailable."); }'
          curl --version | grep -qi HTTP3
          command -v composer
          command -v openssl

      - name: Install candidate dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build certification artifacts and TLS identity
        run: |
          php .github/certification/cert-server.php prepare --root="$PWD"
          mkdir -p .runtime-certification/tls
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes             -keyout .runtime-certification/tls/key.pem             -out .runtime-certification/tls/cert.pem             -days 1 -subj "/CN=localhost"

      - name: Start H3-capable Runwire server
        run: |
          php .github/certification/cert-server.php runwire             --root="$PWD"             --address=127.0.0.1:18444             --tls-cert="$PWD/.runtime-certification/tls/cert.pem"             --tls-key="$PWD/.runtime-certification/tls/key.pem"             --http3=1             > .runtime-certification/live-h3-linux.log 2>&1 &
          echo "RUNWIRE_H3_LINUX_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..120}; do
            if curl -kfsS --http3-only https://127.0.0.1:18444/cert/static >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.25
          done
          cat .runtime-certification/live-h3-linux.log
          exit 1

      - name: Certify Linux HTTP/3 deployment
        run: |
          response="$(curl -kfsS --http3-only https://127.0.0.1:18444/cert/json)"
          jq -e '.ok == true' <<<"$response"
          jq -e '.protocol | tostring | startswith("3")' <<<"$response"
          curl -kfsS --http3-only https://127.0.0.1:18444/cert/stream             | wc -c | grep -q 3072

      - name: Stop Linux H3 server
        if: always()
        run: |
          if [[ -n "${RUNWIRE_H3_LINUX_PID:-}" ]] && kill -0 "$RUNWIRE_H3_LINUX_PID" 2>/dev/null; then
            kill -TERM "$RUNWIRE_H3_LINUX_PID"
            for attempt in {1..120}; do
              if ! kill -0 "$RUNWIRE_H3_LINUX_PID" 2>/dev/null; then
                wait "$RUNWIRE_H3_LINUX_PID" 2>/dev/null || true
                exit 0
              fi
              sleep 0.25
            done
            kill -KILL "$RUNWIRE_H3_LINUX_PID" 2>/dev/null || true
            exit 1
          fi

      - name: Upload Linux H3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-runwire-h3-linux
          path: .runtime-certification/
          if-no-files-found: error
          include-hidden-files: true
