name: Temporary Matcher Phase 8

on:
  push:
    branches:
      - webrick-5/batch-1-correctness

permissions:
  contents: write

jobs:
  phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: webrick-5/batch-1-correctness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Benchmark cached Sharded baseline
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/phase8-baseline.jsonl
          for routes in 1000 5000 10000; do
            for pass in 1 2 3; do
              php benchmark/matcher_envelope.php --matcher=sharded --routes="$routes" --warm-iters=25000 | tee -a /tmp/phase8-baseline.jsonl
            done
          done

      - name: Apply candidate-group memoization
        run: |
          python3 .github/scripts/_tmp_matcher_phase8.py patch
          vendor/bin/pint --config=vendor/infocyph/phpforge/resources/pint.json src/Router/Matching/ShardedMatcher.php

      - name: Benchmark cached Sharded candidate
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/phase8-candidate.jsonl
          for routes in 1000 5000 10000; do
            for pass in 1 2 3; do
              php benchmark/matcher_envelope.php --matcher=sharded --routes="$routes" --warm-iters=25000 | tee -a /tmp/phase8-candidate.jsonl
            done
          done

      - name: Decide Phase 8 retention
        run: python3 .github/scripts/_tmp_matcher_phase8.py decide

      - name: Run Phase 8 final quality gate
        run: composer ic:ci

      - name: Run Phase 8 matcher regressions
        run: |
          vendor/bin/phpbench run benchmarks/MatcherOutcomeBench.php --bootstrap=vendor/autoload.php --report=aggregate
          vendor/bin/phpbench run benchmarks/MatcherScaleBench.php --bootstrap=vendor/autoload.php --report=aggregate
          php benchmark/matcher_envelope.php --matcher=sharded --routes=10000 --warm-iters=25000

      - name: Commit Phase 8 and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-matcher-phase8.yml
          rm -f .github/scripts/_tmp_matcher_phase8.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --no-verify -m "perf: complete sharded matcher residency phase"
          git push origin HEAD:webrick-5/batch-1-correctness
